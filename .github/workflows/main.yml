name: CI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build And Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Deploy
        env:
          RSYNC_PASSWORD: ${{ secrets.SSH_PASS }}
        run: rsync -vzr --delete ./dist ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/opt/blog/dist
